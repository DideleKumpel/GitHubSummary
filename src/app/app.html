<body>
  <nav>
    <div class="search-bar">
      <input type="text" placeholder="Find github profile"
             [(ngModel)]="searchText"
             (keyup.enter)="searchUser()">
    </div>
  </nav>
  <main>
    <div>
      <app-profile-info [userData]="user"></app-profile-info>
    </div>
    <div>
      <app-project-details *ngFor="let repo of repos" [repoData]="repo"></app-project-details>
    </div>
  </main>
</body>
